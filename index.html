<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D 마블 룰렛 (Marble Roulette)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 240px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        textarea {
            width: 100%;
            height: 140px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            resize: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #4CAF50, #2e7d32);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover {
            background: linear-gradient(135deg, #558b2f, #33691e);
            transform: translateY(-1px);
        }
        #winner-board {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #ffeb3b;
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.5;
        }
        .name-tag {
            position: absolute;
            transform: translate(-50%, -100%);
            color: white;
            font-size: 11px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Three.js & Cannon.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

<div id="ui-container">
    <h3>3D 마블 룰렛</h3>
    <textarea id="namesInput">참가자1
참가자2
참가자3
참가자4
참가자5
참가자6
참가자7</textarea>
    <button onclick="startRoulette()">3D 레이스 시작!</button>
    <div id="winner-board"></div>
</div>

<div id="labels-container"></div>
<div id="canvas-container"></div>

<script>
    let scene, camera, renderer;
    let world;
    let marbles = [];
    let rotatingSpinners = [];
    let isRunning = false;
    let rankings = [];

    const canvasContainer = document.getElementById('canvas-container');
    const labelsContainer = document.getElementById('labels-container');

    function init() {
        // 3D 씬 설정
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0f);
        scene.fog = new THREE.FogExp2(0x0b0b0f, 0.025);

        // 카메라 설정
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 23);
        camera.lookAt(0, -1, 0);

        // 렌더러 설정
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        canvasContainer.appendChild(renderer.domElement);

        // 물리 엔진(Cannon.js) 설정
        world = new CANNON.World();
        world.gravity.set(0, -16, 0);
        world.solver.iterations = 10;

        // 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 25, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 맵 및 장애물 생성
        buildEnvironment();

        window.addEventListener('resize', onWindowResize);
        animate(0);
    }

    function buildEnvironment() {
        // 배경 보드 판
        const bgGeo = new THREE.PlaneGeometry(18, 32);
        const bgMat = new THREE.MeshStandardMaterial({ color: 0x14141c, roughness: 0.9 });
        const bgMesh = new THREE.Mesh(bgGeo, bgMat);
        bgMesh.position.set(0, 0, -1.5);
        scene.add(bgMesh);

        // 좌우 벽면
        createWall(-5.5, 0, 0.5, 1, 28, 2);
        createWall(5.5, 0, 0.5, 1, 28, 2);

        // 핀(장애물 못) 배치 - 안정적인 Box 형태 사용
        const rows = 6;
        const startY = 7;
        const spacingY = 2.3;

        for (let r = 0; r < rows; r++) {
            const cols = (r % 2 === 0) ? 4 : 5;
            const spacingX = 9 / (cols + 1);
            for (let c = 0; c < cols; c++) {
                const x = -4.5 + spacingX * (c + 1) + (r % 2 === 0 ? 0 : spacingX / 2);
                const y = startY - r * spacingY;
                createPin(x, y, 0);
            }
        }

        // 회전하는 장애물 (스피너)
        createRotatingSpinner(-2.2, -1, 0, 3.5);
        createRotatingSpinner(2.2, -3.5, 0, -4);
        createRotatingSpinner(0, -6, 0, 4.5);

        // 경사로 추가
        createRamp(-2.5, -9, 0, 5, 0.4, 2, Math.PI / 8);
        createRamp(2.5, -11, 0, 5, 0.4, 2, -Math.PI / 8);
    }

    function createWall(x, y, z, sx, sy, sz) {
        const shape = new CANNON.Box(new CANNON.Vec3(sx/2, sy/2, sz/2));
        const body = new CANNON.Body({ mass: 0 });
        body.addShape(shape);
        body.position.set(x, y, z);
        world.addBody(body);
    }

    function createPin(x, y, z) {
        const size = 0.35;
        const shape = new CANNON.Box(new CANNON.Vec3(size, size, size));
        const body = new CANNON.Body({ mass: 0 });
        body.addShape(shape);
        body.position.set(x, y, z);
        world.addBody(body);

        const geom = new THREE.BoxGeometry(size*2, size*2, size*2);
        const mat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, metalness: 0.8, roughness: 0.2 });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        scene.add(mesh);
    }

    function createRotatingSpinner(x, y, z, speed) {
        const length = 4;
        const thickness = 0.4;
        
        const shape = new CANNON.Box(new CANNON.Vec3(length/2, thickness/2, thickness/2));
        const body = new CANNON.Body({ mass: 0 });
        body.addShape(shape);
        body.position.set(x, y, z);
        world.addBody(body);

        const geom = new THREE.BoxGeometry(length, thickness, thickness);
        const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.6, roughness: 0.2 });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.castShadow = true;
        scene.add(mesh);

        rotatingSpinners.push({ body, mesh, speed });
    }

    function createRamp(x, y, z, sx, sy, sz, angle) {
        const shape = new CANNON.Box(new CANNON.Vec3(sx/2, sy/2, sz/2));
        const body = new CANNON.Body({ mass: 0 });
        body.addShape(shape);
        body.position.set(x, y, z);
        body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), angle);
        world.addBody(body);

        const geom = new THREE.BoxGeometry(sx, sy, sz);
        const mat = new THREE.MeshStandardMaterial({ color: 0x9c27b0, roughness: 0.4 });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(x, y, z);
        mesh.quaternion.copy(body.quaternion);
        mesh.castShadow = true;
        scene.add(mesh);
    }

    function startRoulette() {
        if (isRunning) return;

        const text = document.getElementById('namesInput').value;
        const names = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);

        if (names.length === 0) {
            alert('참가자를 입력해주세요!');
            return;
        }

        // 기존 구슬 삭제
        marbles.forEach(m => {
            world.remove(m.body);
            scene.remove(m.mesh);
            if (m.labelElement) m.labelElement.remove();
        });
        marbles = [];
        rankings = [];
        document.getElementById('winner-board').innerHTML = '';
        labelsContainer.innerHTML = '';
        isRunning = true;

        // 새 구슬 생성 (안전한 생성 코드)
        names.forEach((name, index) => {
            const radius = 0.45;
            const color = new THREE.Color(`hsl(${index * (360 / names.length)}, 90%, 60%)`);

            const shape = new CANNON.Sphere(radius);
            const body = new CANNON.Body({
                mass: 1
            });
            body.addShape(shape);
            
            const spawnX = (Math.random() - 0.5) * 3.5;
            const spawnY = 12 + index * 0.7;
            const spawnZ = (Math.random() - 0.5) * 0.4;
            body.position.set(spawnX, spawnY, spawnZ);
            world.addBody(body);

            const geom = new THREE.SphereGeometry(radius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                metalness: 0.4,
                roughness: 0.15,
                emissive: color,
                emissiveIntensity: 0.15
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.castShadow = true;
            scene.add(mesh);

            const label = document.createElement('div');
            label.className = 'name-tag';
            label.innerText = name;
            labelsContainer.appendChild(label);

            marbles.push({
                name: name,
                body: body,
                mesh: mesh,
                labelElement: label,
                finished: false
            });
        });
    }

    let lastTime = 0;
    function animate(time) {
        requestAnimationFrame(animate);

        const dt = (time - lastTime) * 0.001;
        lastTime = time;

        if (isRunning && dt < 0.1) {
            world.step(1 / 60, dt, 3);

            rotatingSpinners.forEach(s => {
                const angle = time * 0.001 * s.speed;
                s.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), angle);
                s.mesh.quaternion.copy(s.body.quaternion);
            });

            marbles.forEach(m => {
                m.mesh.position.copy(m.body.position);
                m.mesh.quaternion.copy(m.body.quaternion);

                const vector = m.body.position.clone();
                vector.y += 0.75; 
                vector.project(camera);

                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;

                if (m.labelElement) {
                    if (vector.z < 1) {
                        m.labelElement.style.display = 'block';
                        m.labelElement.style.left = `${x}px`;
                        m.labelElement.style.top = `${y}px`;
                    } else {
                        m.labelElement.style.display = 'none';
                    }
                }

                if (!m.finished && m.body.position.y < -13.5) {
                    m.finished = true;
                    rankings.push(m.name);
                    updateRankingsUI();

                    if (m.labelElement) {
                        m.labelElement.style.background = 'rgba(76, 175, 80, 0.85)';
                        m.labelElement.innerText = `${rankings.length}등: ${m.name}`;
                    }
                }
            });

            if (rankings.length === marbles.length) {
                isRunning = false;
            }
        }

        renderer.render(scene, camera);
    }

    function updateRankingsUI() {
        let html = '<b>🏆 실시간 순위 🏆</b><br>';
        rankings.forEach((name, idx) => {
            html += `${idx + 1}등: ${name}<br>`;
        });
        document.getElementById('winner-board').innerHTML = html;
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
</script>
</body>
</html>
